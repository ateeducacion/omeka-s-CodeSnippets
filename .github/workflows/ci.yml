---
name: CI

on:
  pull_request:
  push:
    tags:
      - '*'
    branches:
      - '*'

permissions:
  contents: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v7

      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'  # Adjust the version according to your needs
          coverage: pcov
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Check untranslated strings
        run: make check-untranslated

      - name: Generate .mo file
        run: make compile-mo

      - name: Run code linting
        run: make lint

      - name: Run unit tests
        # pcov auto-detects pcov.directory as src/, which would drop Module.php.
        run: php -d pcov.directory=. -d pcov.exclude='~/(vendor|test)/~' vendor/bin/phpunit -c test/phpunit.xml --coverage-clover coverage.xml --coverage-text

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
